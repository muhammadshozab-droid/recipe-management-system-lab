<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Management System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>My Recipe Book</h1>
        <p>Add and manage your favourite recipes.</p>
    </header>

    <main>

        <!-- Form for adding or editing a recipe -->
        <section class="form-section">
            <h2 id="formHeading">Add a Recipe</h2>

            <form id="recipeForm">

                <label for="title">Recipe Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter recipe title"
                    maxlength="100"
                    required>

                <label for="ingredients">Ingredients</label>
                <textarea
                    id="ingredients"
                    rows="5"
                    placeholder="Write one ingredient per line"
                    maxlength="5000"
                    required></textarea>

                <label for="instructions">Instructions</label>
                <textarea
                    id="instructions"
                    rows="6"
                    placeholder="Explain how to prepare the recipe"
                    maxlength="10000"
                    required></textarea>

                <label for="image">Recipe Image (Optional)</label>
                <input
                    type="file"
                    id="image"
                    accept="image/jpeg,image/png,image/webp,image/gif">

                <p class="small-text">
                    Choose an image smaller than 1 MB.
                </p>

                <img
                    id="imagePreview"
                    alt="Recipe image preview"
                    hidden>

                <div class="form-buttons">
                    <button type="submit" id="saveButton">
                        Add Recipe
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary"
                        hidden>
                        Cancel Edit
                    </button>
                </div>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <p class="small-text">
                Recipes are saved in this browser on this device.
            </p>
        </section>

        <!-- Search and recipe list -->
        <section class="recipes-section">
            <h2>Your Recipes</h2>

            <label for="search">Search Recipes</label>
            <input
                type="search"
                id="search"
                placeholder="Search by title or ingredients">

            <p id="recipeCount" aria-live="polite"></p>
            <p id="emptyMessage">No recipes added yet.</p>

            <div id="recipeList"></div>
        </section>

    </main>

    <!-- Popup for viewing a complete recipe -->
    <dialog id="recipeDialog" aria-labelledby="viewTitle">

        <div class="dialog-heading">
            <h2 id="viewTitle"></h2>

            <button
                type="button"
                id="closeDialog"
                class="secondary">
                Close
            </button>
        </div>

        <img id="viewImage" alt="" hidden>

        <h3>Ingredients</h3>
        <p id="viewIngredients" class="recipe-text"></p>

        <h3>Instructions</h3>
        <p id="viewInstructions" class="recipe-text"></p>

    </dialog>

    <footer>
        <p>Lab 08 — Recipe Management System</p>
    </footer>

</body>
</html>
